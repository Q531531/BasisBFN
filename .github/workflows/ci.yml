name: 自动验证

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: CPU / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11"]
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: 安装 CPU PyTorch 与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1"
          python -m pip install -e ".[dev]" build
      - name: 无权重模块自检
        run: python scripts/smoke_basisbfn.py --device cpu
      - name: 全量回归
        run: python -m pytest -q
      - name: 训练、推理与评测入口
        run: |
          python train.py --help
          python infer.py --help
          python evaluate.py --help
          python scripts/make_basisbfn_config.py --help
          python scripts/preflight_basisbfn.py --help
          python scripts/profile_basisbfn.py --help
          python scripts/analyze_basisbfn.py --help
      - name: 构建 wheel 并检查公开导入
        run: |
          python -m build --wheel
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "from sgbformer import BasisBFN, BasisBFNLoss; from sgbformer.models import BasisBFNReadout"
