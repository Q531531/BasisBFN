[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "basisbfn"
version = "1.0.0"
description = "Bayesian residual refinement with image-dependent bases for adverse weather image restoration"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24",
  "Pillow>=9.5",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24"]
metrics = ["lpips>=0.1.4"]
dev = ["pytest>=8.0"]
all = [
  "lpips>=0.1.4",
  "open_clip_torch>=2.24",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["sgbformer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
