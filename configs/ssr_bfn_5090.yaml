_base_: sgbformer_5090.yaml

# External code and weights stay outside this repository because the official
# SSR repository currently has no license file.
model:
  semantic:
    encoder: none
    embedding_dim: 1
    context_tokens: 1
  foundation:
    type: external_ssr
    repo_path: ${SSR_REPO}
    checkpoint: ${SSR_CHECKPOINT}
    architecture_file: basicsr/models/archs/SSR_arch.py
    model_class: SSR
    feature_module: decoder_level1
    param_key: params
    strict_load: true
    freeze: true
    required_multiple: 8
    checkpoint_compatible_edffn: true
    architecture:
      inp_channels: 3
      out_channels: 3
      dim: 48
      num_blocks: [3, 3, 6]
      ffn_expansion_factor: 3
      bias: false
  bfn:
    steps: 10
    min_variance: 0.0001
    base_channels: 24
    channel_multipliers: [1, 2, 4]
    blocks_per_level: 2
    attention_heads: 4
    dropout: 0.0
    entropy_kernel: 9
    entropy_bins: 16
    entropy_threshold: 0.25
    min_accuracy_scale: 0.25

training:
  output_dir: runs/ssr_bfn_5090
  epochs: 40
  batch_size: 16
  micro_batch_size: 4
  learning_rate: 0.0001
  minimum_learning_rate: 0.000001
  warmup_epochs: 2
  validate_interval: 2
  save_interval: 5
  stages:
    - name: bfn
      epochs: 30
      loss:
        structural_weight: 0.0
        bfn_weight: 0.001
        final_weight: 0.0
    - name: joint
      epochs: 10
      loss:
        structural_weight: 0.0
        bfn_weight: 0.001
        final_weight: 1.0

validation:
  lpips: true
  lpips_network: alex
  crop_border: 0
  test_y_channel: true
