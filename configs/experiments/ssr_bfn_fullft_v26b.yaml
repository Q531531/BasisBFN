_base_: ssr_bfn_fullft_v26.yaml

# =====================================================================
# v26b: the corrected v26 main line (30 epoch). Two variables changed.
# =====================================================================
#
# v26b exists because the 2-epoch pilot of ssr_bfn_fullft_v26.yaml exposed one
# hard blocker (OOM) and one objective-composition defect. Nothing else is
# touched, so any delta against foundation remains attributable.
# Full write-up: docs/FULLFT_BFN_V26.md §"Pilot 实测结果与两处配置缺陷".
#
# ---------------------------------------------------------------------
# Change 1: micro_batch_size 4 -> 2
# ---------------------------------------------------------------------
# 【已测量，服务器 pilot】The training GPU exposes **23.41 GiB** usable, not the
# 32 GiB that v26 was sized for. `micro_batch_size: 4` at 256x256 OOMs on the
# **first forward pass**; `micro_batch_size: 2` is stable for a whole epoch.
#
# 【代码事实】`train.py:421-430`: `accumulation = batch_size / (micro_batch_size
# * world_size)`, so 4 -> 2 only moves gradient accumulation from 4 steps to 8
# steps. The **global batch stays 16**, therefore:
#   * optimizer steps per epoch stay at 17166 / 16 = 1073 【已测量: 1073】,
#   * the learning rates (2e-4 new modules / 1.5e-5 `backbone.model`) and the
#     epoch-stepped cosine schedule need **no** adjustment
#     (【代码事实】`sgbformer/training.py:87-99` steps per *epoch*, not per
#     micro-batch).
# 【已测量】micro-batches per epoch 17166 / 2 = 8583; 3482.9 s/epoch = 0.968 h,
# i.e. 30 epochs ≈ 29.0 GPU hours.
#
# ---------------------------------------------------------------------
# Change 2: loss weights (frequency / bfn / latent_category)
# ---------------------------------------------------------------------
# 【代码事实】`sgbformer/losses.py:174-183` sums the *weighted* terms
# (`total = structural_weight*structural + bfn_weight*bfn +
# frequency_weight*frequency + latent_category_weight*category`), while the
# diagnostics dict returned at `losses.py:184-194` contains the **unweighted**
# raw values. The v26 pilot log therefore had to be re-weighted by hand.
#
# 【已测量，pilot epoch 2 末段日志】raw components:
#   struct 0.00093  bfn 0.04451  freq 0.00944  latent_cls 0.01701
#   (log line: loss=0.00201 struct=0.00093 bfn=0.04451 final=0.00000
#    corr=0.00000 freq=0.00944 unc=0.00000 latent_cls=0.01701 lr=1.500e-05)
#
# v26 weights (struct 1.0 / bfn 0.01 / freq 0.05 / cls 0.01) contribute:
#   struct : 1.00  x 0.00093 = 9.300e-4  -> 46.1%
#   freq   : 0.05  x 0.00944 = 4.720e-4  -> 23.4%
#   bfn    : 0.01  x 0.04451 = 4.451e-4  -> 22.1%
#   cls    : 0.01  x 0.01701 = 1.701e-4  ->  8.4%
#   total  =                   2.0172e-3, which matches the logged
#                              loss=0.00201 to within the 5-decimal display
#                              rounding (gap 7.2e-6; the accumulated rounding
#                              budget of the five printed numbers is ~1.05e-5)
#                              -> the decomposition is verified, not assumed.
# So **53.9% of the gradient signal was not pixel fidelity**, and
# `frequency_weight: 0.05` was a second objective of the same magnitude as the
# pixel term rather than a mild regulariser. That is the most plausible direct
# cause of the measured -0.083995 dB dev PSNR regression.
#
# v26b weights (struct 1.0 / bfn 0.004 / freq 0.01 / cls 0.002) contribute, at
# the *same* raw component values:
#   freq   : 0.010 x 0.00944 = 9.440e-5
#   bfn    : 0.004 x 0.04451 = 1.7804e-4
#   cls    : 0.002 x 0.01701 = 3.402e-5
#   non-pixel subtotal       = 3.0646e-4  (= 32.95% of struct's 9.300e-4)
#   total  = 9.300e-4 + 3.0646e-4 = 1.23646e-3
#   pixel share = 9.300e-4 / 1.23646e-3 = **75.2%** (up from 46.1%)
# 【估算】The raw components will drift once the weights change (this is a
# first-order reweighting of the *observed* pilot values, not a prediction of
# the new equilibrium); the ratio is nevertheless the only quantity we can
# control directly, and tests/test_fullft_v26_config.py freezes this arithmetic
# so nobody silently re-tunes the weights again.
# The auxiliary terms are deliberately kept non-zero: the BFN path must stay
# supervised (it is the one paper-level requirement v26 preserves) and
# `latent_category_weight > 0` is what feeds the category head
# (【代码事实】`losses.py:161-171` raises when logits/labels are missing).
#
# ---------------------------------------------------------------------
# What is deliberately NOT changed (so attribution stays clean)
# ---------------------------------------------------------------------
# Loss weights + micro batch are the **only** changed variable group:
#   * `parameter_lrs.backbone.model` stays 1.5e-5, `learning_rate` stays 2e-4,
#   * `warmup_epochs: 1`, `minimum_learning_rate_ratio: 0.1` unchanged,
#   * `sampling.mode: category_balanced` (0.50/0.25/0.25) unchanged,
#   * `foundation.freeze: false`, `trainable_modules: []` unchanged
#     (【已测量】trainable params 11,287,509),
#   * latent BFN steps 4 / `update_mode: bayesian` unchanged,
#   * `data.train.pairs_file: ${SGB_DATA_ROOT}/train_pairs.tsv` unchanged
#     (903 dev pairs held out).
# Judgement must use the **macro-weighted** dev delta from
# `scripts/analyze_dev_by_category.py`, never the natural-distribution dev mean
# (see docs/FULLFT_BFN_V26.md, diagnosis C).
#
# Run the 6-epoch `ssr_bfn_fullft_v26b_proxy.yaml` before spending 29 GPU hours
# here: the 2-epoch pilot never left peak LR and cannot judge this protocol.

training:
  output_dir: runs/fullft_v26b/main
  micro_batch_size: 2

loss:
  frequency_weight: 0.01
  bfn_weight: 0.004
  latent_category_weight: 0.002
