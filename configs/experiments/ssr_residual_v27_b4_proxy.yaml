_base_: ssr_residual_v27_d4_proxy.yaml

# Complete v27 arm. Relative to D4, only the parameter-free state update,
# protocol label, and output directory may differ.
protocol:
  arm: B4
  arm_description: four-step Bayesian posterior-mean residual

model:
  bfn:
    update_mode: bayesian

training:
  output_dir: runs/residual_bfn_v27/b4_proxy
  v27_profile_report: runs/residual_bfn_v27/profiles/B4.json
