_base_: _ssr_residual_bfn_v27_common.yaml

# Stage A1 recurrence control: four deterministic residual-state updates.
protocol:
  arm: D4
  arm_description: four-step deterministic posterior-mean residual

model:
  bfn:
    inference_mode: iterative
    update_mode: deterministic
    readout_mode: posterior_mean
    steps: 4
    training_rollout_steps: 4
    rollout_backprop_steps: 1

loss:
  bfn_weight: 0.01

training:
  output_dir: runs/residual_bfn_v27/d4_proxy
  v27_profile_report: runs/residual_bfn_v27/profiles/D4.json
  stage_a0_decision_report: runs/residual_bfn_v27/analysis/stage_a0/summary.json
  stages:
    - name: joint
      epochs: 6
