_base_: ssr_bfn_fullft_v26.yaml

# #####################################################################
# STATUS: SUPERSEDED / COMPLETED - kept as the failure record
# #####################################################################
# This pilot has already run; its configuration is intentionally left as-is.
# New experiments must use `ssr_bfn_fullft_v26b_proxy.yaml` (6 epoch) and then
# `ssr_bfn_fullft_v26b.yaml` (30 epoch). What the pilot established:
#
# * 【已测量】`micro_batch_size: 4` (inherited from v26) **OOMs** on the 23.41
#   GiB training GPU at the very first forward pass; `micro_batch_size: 2` is
#   stable. 【代码事实】`train.py:421-430`: global batch stays 16 (accumulation
#   4 -> 8), so no LR/schedule change is implied.
# * 【已测量】trainable params 11,287,509; 8583 micro-batches and 1073 optimizer
#   steps per epoch at mb2; 3482.9 s = 0.968 h per epoch (30 epochs ≈ 29 h).
# * 【已测量】the inherited loss weights put only **46.1%** of the objective on
#   pixel fidelity: struct 1.0x0.00093 = 9.300e-4 (46.1%),
#   freq 0.05x0.00944 = 4.720e-4 (23.4%), bfn 0.01x0.04451 = 4.451e-4 (22.1%),
#   cls 0.01x0.01701 = 1.701e-4 (8.4%), total 2.0172e-3 = the logged
#   loss=0.00201. 【代码事实】`losses.py:174-183` (weighted sum) vs
#   `losses.py:184-194` (unweighted diagnostics). v26b rebalances to 75.2%.
# * 【已测量】dev (903 pairs): foundation 34.76885 / 0.94353 vs pilot
#   best_psnr.pt 34.68485 / 0.94330, ΔPSNR -0.083995,
#   CI95 [-0.097263, -0.070903], improved 292/903.
#
# **This -0.084 dB must not be read as "v26 degrades quality".** 【代码事实】
# `sgbformer/training.py:87-99` with `total_epochs: 2`, `warmup_epochs: 1`,
# `minimum_learning_rate_ratio: 0.1`: epoch 0 hits the warmup branch
# ((0+1)/1 = 1.0) and epoch 1 gets progress = (1-1)/1 = 0 -> factor 1.0. Both
# epochs ran at 100% of peak LR with zero annealing, exactly matching the
# constant `lr=1.500e-05` in the log. A 2-epoch, never-annealed, fully
# unfrozen snapshot cannot decide the protocol - hence the 6-epoch proxy, whose
# final factor is 0.185942 (backbone LR 2.7891e-6).

# v26 pilot: 2 epochs on the 5090 before committing the 30-epoch main run.
# Purpose: confirm no OOM with micro_batch_size 4 at 256x256, measure
# seconds/optimizer-step (about 1073 steps per epoch for 17166 train pairs),
# and verify the dev PSNR of
# epoch 1-2 does not collapse relative to the frozen-SSR dev baseline.
# Nothing except the run length, the output directory and the log cadence
# differs from the main line, so the pilot timing transfers directly.

training:
  output_dir: runs/fullft_v26/pilot
  epochs: 2
  stages:
    - name: joint
      epochs: 2
  log_interval: 50
