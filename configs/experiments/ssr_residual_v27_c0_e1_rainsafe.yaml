_base_: ssr_residual_v27_c0_proxy.yaml

# Exploratory branch-B capacity control. This is not a replacement for the
# preregistered C0 Stage A0 result. The only behavioral change is sampling.
protocol:
  name: residual_bfn_v27_exploratory
  arm: C0-E1
  arm_description: direct residual head with rain-safe category sampling
  preregistered: false
  primary_endpoint: fixed_epoch_3
  checkpoint_selection: fixed_epoch_3_only

training:
  output_dir: runs/residual_bfn_v27_exploratory/c0_e1_rainsafe
  v27_preflight_report: runs/residual_bfn_v27_exploratory/preflight/preflight.json
  v27_profile_report: runs/residual_bfn_v27_exploratory/profiles/C0-E1.json
  sampling:
    mode: category_balanced
    category_patterns:
      snow: '.*\.jpe?g'
      outdoor_rain: 'im_\d+_s\d+_a0[456]\.png'
      raindrop: '\d+_rain\.png'
    target_fractions:
      snow: 0.30
      outdoor_rain: 0.45
      raindrop: 0.25
