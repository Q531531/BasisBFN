_base_: ../ssr_bfn_5090.yaml

# Paper ablation A0: trainable SSR suffix only. It is listed now but remains
# budget-locked until the D/B method is frozen and the same protocol is used.
seed: 42

protocol:
  name: frozen_paper_ablation
  arm: A0
  arm_description: trainable SSR suffix without spectral or condition branch
  expected_train_pairs: 18069
  expected_dev_pairs: 903
  checkpoint_selection: dev_y_psnr
  official_test_locked: true
  budget_policy:
    requested_gpu_hours_per_arm: 10.0
    minimum_epochs: 12
    maximum_epochs: 30
    hard_gpu_hour_cap_per_arm: 16.0
    shared_epoch_rule: reuse_frozen_main_epochs
    ablations_reuse_main_epochs: true

model:
  core:
    require_spectral_gate: false
    require_iterative_bfn: false
    require_entropy_mask: false
  foundation:
    frozen_modules_eval: true
    trainable_modules:
      - decoder_level1
      - decoder_level2
      - output
    feature_adapters: {}
  bfn:
    inference_mode: none
    receiver_trainable: false
    mask_mode: none

data:
  workers: 12
  train:
    input_dir: ${SGB_DATA_ROOT}/input
    target_dir: ${SGB_DATA_ROOT}/gt
    pairs_file: null
    patch_size: 256
    augment: true
    strict: true
  val:
    input_dir: ${SGB_DATA_ROOT}/input
    target_dir: ${SGB_DATA_ROOT}/gt
    pairs_file: ${SGB_DATA_ROOT}/val_pairs.tsv
    strict: true

loss:
  structural_weight: 1.0
  bfn_weight: 0.0
  final_weight: 0.0
  correlation_weight: 0.0
  frequency_weight: 0.0
  adapter_weight: 0.0
  uncertainty_weight: 0.0
  latent_category_weight: 0.0
  structural_loss_type: mse
  final_loss_type: mse

validation:
  lpips: false
  lpips_network: alex
  crop_border: 0
  test_y_channel: true

training:
  output_dir: runs/frozen_ablation/A0
  epochs: 1
  batch_size: 16
  micro_batch_size: 4
  learning_rate: 0.0002
  parameter_lrs:
    backbone.model.decoder_level1: 0.00002
    backbone.model.decoder_level2: 0.00002
    backbone.model.output: 0.00002
  minimum_learning_rate: 0.000001
  minimum_learning_rate_ratio: 0.1
  warmup_epochs: 1
  schedule_minimum_mode: per_group
  betas: [0.9, 0.999]
  weight_decay: 0.0001
  gradient_clip: 1.0
  ema_decay: 0.999
  ema_warmup_updates: 2000
  amp: true
  amp_dtype: bfloat16
  allow_tf32: true
  cudnn_benchmark: true
  reproducible_data: true
  sampling:
    mode: shuffle
  validate_interval: 1
  save_interval: 1
  log_interval: 250
  require_budget_lock: true
  budget_locked: false
  budget_manifest: null
  budget_arm: A0
  stages:
    - name: structure
      epochs: 1
