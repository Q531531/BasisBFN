_base_: ssr_bfn_fullft_v26b_proxy.yaml

# =====================================================================
# v26c no-balance proxy: isolate the category-balanced sampler
# =====================================================================
#
# Decision evidence (v26b proxy, same held-out 903-image dev):
#
#   epoch 5:
#     snow          +0.043039  CI95 [+0.031610, +0.053988]
#     outdoor_rain  -0.138830  CI95 [-0.154207, -0.123465]
#     raindrop      -0.032129  CI95 [-0.095742, +0.028445]
#   epoch 6:
#     snow          +0.045867  CI95 [+0.033804, +0.058204]
#     outdoor_rain  -0.147522  CI95 [-0.163562, -0.131644]
#     raindrop      -0.021282  CI95 [-0.080522, +0.036743]
#
# The balanced epoch draws 4,292 / 7,839 available Outdoor-Rain images while
# repeating 763 RainDrop images into 4,291 draws. The intended RainDrop gain
# was not observed, whereas Outdoor-Rain regressed strongly and reproducibly.
#
# This experiment changes one behavioral variable only:
#   category_balanced -> deterministic shuffle.
#
# Everything else is inherited unchanged from v26b proxy:
#   * six epochs and the same cosine schedule;
#   * full SSR unfreeze, backbone LR 1.5e-5, new-module LR 2e-4;
#   * structural/frequency/BFN/category weights 1.0/0.01/0.004/0.002;
#   * latent BFN steps 4, Bayesian update;
#   * micro batch 2, global batch 16, seed 42;
#   * the same 17166 train / 903 held-out dev manifests.
#
# latent_category_weight deliberately remains 0.002. Removing it together with
# balanced sampling would change two variables and destroy attribution. Under
# shuffle it remains a valid auxiliary classifier on the natural mixture.
#
# Config merging is recursive, so the inherited category_patterns and
# target_fractions remain present but are inert: train.py dispatches exclusively
# on sampling.mode and the shuffle branch never reads those keys.

training:
  output_dir: runs/fullft_v26c/nobalance_proxy
  sampling:
    mode: shuffle
