_base_: ssr_residual_v27_c0doubleprime_bottleneck_routed.yaml

# E2 control: learn only whether to accept the fixed C0-double-prime correction.
protocol:
  name: residual_bfn_v27_exploratory
  arm: C0-accept
  arm_description: frozen C0-double-prime basis with identity-safe acceptance gate
  source_arm: C0-double-prime
  source_checkpoint: epoch_0003.pt
  warm_start_weights: ema
  base_receiver_frozen: true
  preregistered: true
  primary_endpoint: fixed_epoch_3
  checkpoint_selection: fixed_epoch_3_only
  expected_trainable_parameters: 17

model:
  bfn:
    routed_readout:
      acceptance_gate:
        enabled: true
        type: global_average_linear_hard_clamp
        range: [0.0, 1.0]
        zero_init: true
        freeze_base_receiver: true

training:
  output_dir: runs/residual_bfn_v27_exploratory/c0accept_gate
  v27_preflight_report: runs/residual_bfn_v27_exploratory/preflight/preflight_c0accept.json
  v27_profile_report: runs/residual_bfn_v27_exploratory/profiles/C0-accept.json
  initialization_checkpoint: runs/residual_bfn_v27_exploratory/preflight/c0accept_init.pt
