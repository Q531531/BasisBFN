_base_: ssr_residual_v27_c0prime_routed.yaml

# Single-variable correction for the observed C0-prime expert symmetry collapse.
protocol:
  name: residual_bfn_v27_exploratory
  arm: C0-double-prime
  arm_description: independently initialized private bottleneck routed readout
  preregistered: true
  primary_endpoint: fixed_epoch_3
  checkpoint_selection: fixed_epoch_3_only
  expected_trainable_parameters: 622496

model:
  bfn:
    routed_readout:
      head_type: groupnorm_conv3x3_silu_groupnorm_silu_conv3x3

training:
  output_dir: runs/residual_bfn_v27_exploratory/c0doubleprime_bottleneck_routed
  v27_preflight_report: runs/residual_bfn_v27_exploratory/preflight/preflight_c0doubleprime.json
  v27_profile_report: runs/residual_bfn_v27_exploratory/profiles/C0-double-prime.json
