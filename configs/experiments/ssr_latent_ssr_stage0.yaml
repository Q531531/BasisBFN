_base_: ../ssr_bfn_5090.yaml

# Arm C: frozen, unmodified SSR. This arm is evaluated directly and has no
# trainable Stage 0 parameters, latent head, or adapter.
model:
  core:
    require_spectral_gate: false
    require_iterative_bfn: false
    require_entropy_mask: false
  foundation:
    frozen_modules_eval: true
    trainable_modules: []
    feature_adapters: {}
  bfn:
    inference_mode: none
    receiver_trainable: false
    mask_mode: none

data:
  workers: 12
  train:
    input_dir: ${SGB_DATA_ROOT}/input
    target_dir: ${SGB_DATA_ROOT}/gt
    pairs_file: ${SGB_DATA_ROOT}/train_pairs.tsv
    patch_size: 256
    augment: true
    strict: true
  val:
    input_dir: ${SGB_DATA_ROOT}/input
    target_dir: ${SGB_DATA_ROOT}/gt
    pairs_file: ${SGB_DATA_ROOT}/val_pairs.tsv
    strict: true

validation:
  lpips: false
  lpips_network: alex
  crop_border: 0
  test_y_channel: true

training:
  output_dir: runs/latent_bfn/stage0/ssr_read_only
  stage0_baseline_only: true
  epochs: 3
