_base_: ssr_residual_v27_c0_proxy.yaml

# Capacity test for a new signed spatial basis. No BFN, router, or labels.
protocol:
  name: deterministic_basis_v28
  arm: R0
  arm_description: four learned RGB bases with bounded signed spatial coefficients
  preregistered: true
  primary_endpoint: fixed_epoch_6
  diagnostic_endpoints: [fixed_epoch_1, fixed_epoch_2, fixed_epoch_3, fixed_epoch_4, fixed_epoch_5]
  checkpoint_selection: fixed_epoch_6_only
  expected_trainable_parameters: 616340
  continuation_gate:
    macro_delta_psnr_min: 0.05
    macro_ci95_lower_strictly_positive: true
    outdoor_rain_delta_min: -0.003
    outdoor_rain_ci95_upper_nonnegative: true
    raindrop_delta_min: -0.005
    raindrop_ci95_upper_nonnegative: true

model:
  bfn:
    signed_basis_readout:
      enabled: true
      type: spatial_rgb_basis
      num_bases: 4
      kernel_size: 3
      basis_init: dct_orthogonal
      basis_init_gain: 1.0
      coefficient_activation: tanh
      coefficient_range: [-1.0, 1.0]
      normalization: inverse_sqrt_num_bases
      zero_init_coefficients: true

training:
  output_dir: runs/deterministic_basis_v28/r0
  require_v27_preflight: false
  v27_preflight_report: null
  v27_profile_report: null
  v28_preflight_report: runs/deterministic_basis_v28/preflight/preflight_r0.json
  v28_profile_report: runs/deterministic_basis_v28/profiles/R0.json
