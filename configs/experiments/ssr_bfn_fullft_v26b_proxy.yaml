_base_: ssr_bfn_fullft_v26b.yaml

# =====================================================================
# v26b proxy: 6-epoch decision run (about 5.8 GPU hours)
# =====================================================================
#
# Purpose: decide whether the corrected v26b main line is worth 29 GPU hours,
# using the cheapest run length that actually contains learning-rate decay.
#
# ---------------------------------------------------------------------
# Why the 2-epoch pilot cannot be used for that decision
# ---------------------------------------------------------------------
# 【代码事实】`sgbformer/training.py:87-99` (`cosine_warmup_factor`) steps per
# *epoch*:
#     if warmup_epochs > 0 and epoch < warmup_epochs:
#         return max((epoch + 1) / warmup_epochs, 1e-8)
#     cosine_epochs = max(total_epochs - warmup_epochs, 1)
#     progress = min(max((epoch - warmup_epochs) / cosine_epochs, 0.0), 1.0)
#     cosine = 0.5 * (1.0 + cos(pi * progress))
#     return minimum_ratio + (1.0 - minimum_ratio) * cosine
# With the inherited `warmup_epochs: 1` and `minimum_learning_rate_ratio: 0.1`:
#   * pilot, total_epochs = 2:
#       epoch 0 -> warmup branch -> factor (0+1)/1 = **1.0**
#       epoch 1 -> cosine_epochs = 1, progress = (1-1)/1 = 0, cos(0) = 1,
#                  factor = 0.1 + 0.9*1.0 = **1.0**
#     Both epochs run at **100% of peak LR; the decay factor never drops**,
#     which is exactly what the pilot log shows (`lr=1.500e-05` constant).
#   * this proxy, total_epochs = 6:
#       epoch 5 -> progress = (5-1)/5 = 0.8, cos(0.8*pi) = -0.809017,
#                  cosine = 0.0954915, factor = 0.1 + 0.9*0.0954915 = **0.185942**
#                  -> backbone LR = 1.5e-5 * 0.185942 = **2.7891e-6**
#   * main line, total_epochs = 30:
#       epoch 29 -> progress = 28/29 = 0.9655172, cos(0.9655172*pi) = -0.994138,
#                   cosine = 0.0029311, factor = **0.102638**
#                   -> backbone LR = 1.5e-5 * 0.102638 = **1.5396e-6**
# (These four factors are asserted in tests/test_fullft_v26_config.py against
# `cosine_warmup_factor` itself, so they are computed, not hand-rounded.)
# Conclusion: the pilot's -0.083995 dB is a snapshot of "everything unfrozen,
# permanently at peak LR, never annealed". It is methodologically invalid as
# evidence that v26 degrades quality. 6 epochs is the shortest schedule that
# still performs real annealing (down to 18.6% of peak).
#
# ---------------------------------------------------------------------
# Cost
# ---------------------------------------------------------------------
# 【已测量】0.968 h/epoch at micro_batch_size 2 (3482.9 s, 8583 micro-batches,
# 1073 optimizer steps). 6 x 0.968 h = **5.81 GPU hours** versus 29.0 h for the
# 30-epoch main line: a 20% down payment for a real go/no-go signal.
#
# ---------------------------------------------------------------------
# How to judge this run (do NOT use best_psnr.pt, do NOT use the dev mean)
# ---------------------------------------------------------------------
# 1. 【代码事实】`train.py:986-1035`: `best_psnr.pt` is selected by
#    `validation["psnr"]`, the **arithmetic mean over the 903 natural-
#    distribution dev pairs**. train.py must not be edited (it is inside the
#    frozen-main SHA256 manifest, `sgbformer/protocol.py`), so this selection
#    rule cannot be changed - it must be **bypassed offline**.
# 2. Training samples the macro mixture Snow 0.50 / Outdoor-Rain 0.25 /
#    RainDrop 0.25 (inherited `training.sampling.target_fractions`), while dev
#    is a natural-distribution 5% subset (about Snow 450 / Outdoor-Rain 412 /
#    RainDrop 41). Outdoor-Rain is down-weighted from ~45.7% to 25% (0.55x) and
#    RainDrop up-weighted ~5.5x, so the natural-distribution dev mean falls by
#    construction even when the official macro metric rises.
# 3. Therefore: evaluate **every** `runs/fullft_v26b/proxy/epoch_000N.pt`
#    offline on the 903 dev pairs, run
#    `scripts/analyze_dev_by_category.py` against the foundation dev JSON, and
#    select the epoch with the best **macro_weighted.psnr.delta**. The exact
#    command sequence is in docs/FULLFT_BFN_V26.md.
# 4. 【代码事实】`train.py:1010-1024` with the inherited `save_interval: 1`
#    writes one `epoch_000N.pt` per epoch, so all 6 candidates exist.
#
# Inheritance chain: this file -> ssr_bfn_fullft_v26b.yaml ->
# ssr_bfn_fullft_v26.yaml -> ../ssr_bfn_5090.yaml. 【代码事实】
# `sgbformer/config.py:36-46` resolves `_base_` recursively relative to each
# file's own directory and deep-merges dicts (lists are replaced wholesale,
# which is why `stages` is restated in full here).
# tests/test_fullft_v26_config.py asserts the resolved values of this chain.

training:
  output_dir: runs/fullft_v26b/proxy
  epochs: 6
  stages:
    - name: joint
      epochs: 6
